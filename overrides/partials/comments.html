<!-- Synchronize Giscus theme with MkDocs Material palette -->
<script>
  var giscusTheme = localStorage.getItem("data-md-color-scheme") === "slate"
    ? "dark"
    : "light";

  // Set Giscus theme on initial load
  var giscusScript = document.querySelector("script[src*='giscus.app/client.js']");
  if (giscusScript) {
    giscusScript.setAttribute("data-theme", giscusTheme);
  }

  // Listen for palette changes
  var paletteSwitch = document.querySelector("[data-md-component=palette]");
  if (paletteSwitch) {
    paletteSwitch.addEventListener("click", function () {
      var newTheme = localStorage.getItem("data-md-color-scheme") === "slate"
        ? "dark"
        : "light";
      // Tell Giscus to switch theme
      var frame = document.querySelector("[id^='giscus-']");
      if (frame) {
        frame.contentWindow.postMessage(
          { giscus: { setConfig: { theme: newTheme } } },
          "https://giscus.app"
        );
      }
    });
  }
</script>
