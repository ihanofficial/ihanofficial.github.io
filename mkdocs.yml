site_name: ihanofficial
site_url: https://ihanofficial.github.io
site_description: >-
  个人知识库与技术笔记，基于 Material for MkDocs 构建。
site_author: ihanofficial

repo_url: https://github.com/ihanofficial/ihanofficial.github.io
repo_name: ihanofficial/ihanofficial.github.io

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: white
      accent: grey
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式
    - scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式
  font: false
  icon:
    logo: material/book-open-variant
  favicon: assets/favicon.png

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ihanofficial

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang:
        - en
        - ja
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      type: date
  - statistics:
      page_statistics: true
      page_read_time: true

nav:
  - 主页 Home:
      - index.md
      - 站点统计: statistics.md
  - 研究 Research:
      - research/index.md
  - 学习 Learning:
      - learning/index.md
  - 项目 Projects:
      - projects/index.md
  - 阅读 Reading:
      - reading/index.md
  - 杂项 Misc:
      - misc/index.md
      - 归档 Legacy:
          - getting-started/index.md
          - 安装与本地预览: getting-started/installation.md
          - 编写文档: getting-started/writing.md
          - Markdown 扩展: guide/markdown.md
          - 代码块与高亮: guide/code-blocks.md
          - 提示与警告框: guide/admonitions.md
  - 关于 About:
      - about/index.md

extra_css:
  - https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont/lxgwwenkaiscreen.css
  - https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap
  - stylesheets/custom.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
